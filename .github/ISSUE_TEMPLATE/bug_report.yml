name: Bug report
description: Report a reproducible CallWaveKit failure
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: CallWaveKit version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iOS, Xcode and device
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Attach diagnosticsSnapshot().dictionaryRepresentation(). Remove debug SIP traces and credentials.
