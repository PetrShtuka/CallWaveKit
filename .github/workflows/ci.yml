name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: xcodebuild -version
      - name: Verify PJSIP binary
        run: ./Scripts/verify-pjsip-xcframework.sh
      - name: Run package tests
        run: ./Scripts/run-package-tests.sh

  build-device:
    name: Build for device
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build arm64 device slice
        run: ACTION=build DESTINATION='generic/platform=iOS' ./Scripts/run-package-tests.sh

  strict-concurrency:
    name: Strict Swift concurrency
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build with complete checking
        run: >-
          ACTION=build DESTINATION='generic/platform=iOS Simulator'
          ./Scripts/run-package-tests.sh
          'OTHER_SWIFT_FLAGS=$(inherited) -strict-concurrency=complete'

  lint-podspec:
    name: Lint podspec
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: pod lib lint
        run: pod lib lint CallWaveKit.podspec --skip-tests --platforms=ios
